services:
  postgres:
    image: postgres:16-alpine
    container_name: filedrop-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: filedrop
      POSTGRES_PASSWORD: filedrop
      POSTGRES_DB: filedrop
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
